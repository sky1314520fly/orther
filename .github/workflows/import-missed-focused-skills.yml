name: Import missed focused AI skill repositories

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-missed-focused-skills.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Import focused repositories
        shell: bash
        run: |
          set -euo pipefail
          repos=(
            "EveryInc/compound-engineering-plugin"
            "Fission-AI/OpenSpec"
            "SuperClaude-Org/SuperClaude_Framework"
            "Yeachan-Heo/oh-my-claudecode"
            "code-yeongyu/oh-my-openagent"
            "davila7/claude-code-templates"
            "garrytan/gbrain"
            "garrytan/gstack"
            "google-labs-code/design.md"
            "luongnv89/claude-howto"
            "nexu-io/open-design"
            "openai/codex-plugin-cc"
            "shanraisshan/claude-code-best-practice"
            "wshobson/agents"
            "bmad-code-org/BMAD-METHOD"
            "anthropics/knowledge-work-plugins"
            "can1357/oh-my-pi"
            "Egonex-AI/Understand-Anything"
            "Hmbown/Codewhale"
            "different-ai/openwork"
          )
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for repo in "${repos[@]}"; do
            owner=${repo%%/*}
            name=${repo#*/}
            dest="${owner}--${name}"
            tmp="/tmp/import-${owner}-${name}"
            rm -rf "$tmp" "$dest"
            git clone --depth=1 --filter=blob:none "https://github.com/${repo}.git" "$tmp"
            commit=$(git -C "$tmp" rev-parse HEAD)
            branch=$(git -C "$tmp" branch --show-current)
            stars=$(gh api "repos/${repo}" --jq '.stargazers_count')
            license=$(gh api "repos/${repo}" --jq '.license.spdx_id // "SEE-LICENSE"')
            skill_count=$(find "$tmp" -type f -name SKILL.md -not -path '*/.git/*' | wc -l)
            test "$stars" -gt 20000
            test "$skill_count" -gt 0
            if find "$tmp" -type f -not -path '*/.git/*' -size +99M -print -quit | grep -q .; then
              printf '\n- `%s`：包含超过 GitHub 100 MiB 限制的文件，未导入。\n' "$repo" >> SKILLS_EXCLUDED.md
              rm -rf "$tmp"
              continue
            fi
            mkdir -p "$dest"
            cp -a "$tmp"/. "$dest"/
            rm -rf "$dest/.git"
            git add -f "$dest"
            git commit -m "chore(skills): import ${repo} at ${commit}"
            git push
            git pull --rebase
            printf '| [%s](%s/) | %s | %s | `%s` | `%s` | [`%s`](https://github.com/%s/commit/%s) |\n' "$repo" "$dest" "$stars" "$skill_count" "$license" "$branch" "${commit:0:12}" "$repo" "$commit" >> SKILLS_INDEX.md
            git add SKILLS_INDEX.md
            git commit -m "docs: index ${repo}"
            git push
            rm -rf "$tmp"
          done
          printf '\n- `Yeachan-Heo/oh-my-codex`：未发现明确的仓库级许可证。\n' >> SKILLS_EXCLUDED.md
          printf '- `claude-code-best/claude-code`：未发现明确的仓库级许可证。\n' >> SKILLS_EXCLUDED.md
          git add SKILLS_EXCLUDED.md
          git commit -m "docs: record newly excluded repositories"
          git push
          git pull --rebase
          git rm .github/workflows/import-missed-focused-skills.yml
          git commit -m "chore: remove completed focused skills importer"
          git push
