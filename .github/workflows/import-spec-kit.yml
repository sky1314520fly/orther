name: Import github spec-kit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-spec-kit.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Import fixed upstream revision
        shell: bash
        run: |
          set -euo pipefail
          repo="github/spec-kit"
          dest="github--spec-kit"
          tmp="/tmp/spec-kit"
          git clone --depth=1 --filter=blob:none https://github.com/github/spec-kit.git "$tmp"
          commit=$(git -C "$tmp" rev-parse HEAD)
          branch=$(git -C "$tmp" branch --show-current)
          stars=$(gh api repos/github/spec-kit --jq '.stargazers_count')
          license=$(gh api repos/github/spec-kit --jq '.license.spdx_id')
          skill_count=$(find "$tmp" -type f -name SKILL.md -not -path '*/.git/*' | wc -l)
          test "$stars" -gt 20000
          test "$skill_count" -gt 0
          rm -rf "$dest"
          mkdir -p "$dest"
          cp -a "$tmp"/. "$dest"/
          rm -rf "$dest/.git"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "$dest"
          git commit -m "chore(skills): import github/spec-kit at ${commit}"
          git push
          git pull --rebase
          printf '| [%s](%s/) | %s | %s | `%s` | `%s` | [`%s`](https://github.com/%s/commit/%s) |\n' "$repo" "$dest" "$stars" "$skill_count" "$license" "$branch" "${commit:0:12}" "$repo" "$commit" >> SKILLS_INDEX.md
          git add SKILLS_INDEX.md
          git commit -m "docs: add github/spec-kit to skills index"
          git push
          git pull --rebase
          git rm .github/workflows/import-spec-kit.yml
          git commit -m "chore: remove completed spec-kit importer"
          git push
